apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-production-cert
  namespace: default
spec:
  secretName: wildcard-tls-secret
  issuerRef:
    name: letsencrypt-dns01-cloudflare
    kind: ClusterIssuer
  dnsNames:
  - "*.company.internal"
  - "company.internal"
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days before expiration
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  usages:
  - digital signature
  - key encipherment
  - server auth
