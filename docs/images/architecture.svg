<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="70" y="60" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="0.3">Cert-Manager Automated TLS &amp; Let's Encrypt PKI Architecture Blueprint</text>
  <rect x="850" y="40" width="140" height="26" rx="13" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="863" y="58" fill="#b91c1c" font-size="11" font-weight="700">ACME AUTOMATION</text>
  <rect x="1000" y="40" width="140" height="26" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1018" y="58" fill="#1d4ed8" font-size="11" font-weight="700">WILDCARD DNS-01</text>

  <!-- COLUMN 1: ClusterIssuers & ACME -->
  <rect x="40" y="110" width="340" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="40" y="110" width="340" height="40" rx="8" fill="#f1f5f9"/>
  <text x="60" y="136" fill="#0284c7" font-size="13" font-weight="700">1. CLUSTERISSUERS &amp; ACME SOLVERS</text>

  <rect x="60" y="165" width="300" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="192" fill="#0f172a" font-size="14" font-weight="600">HTTP-01 ClusterIssuer</text>
  <text x="75" y="214" fill="#64748b" font-size="11">Production &amp; Staging ACME endpoints</text>
  <text x="75" y="234" fill="#0284c7" font-size="10" font-weight="600">Solver: NGINX Ingress Class</text>
  <text x="75" y="248" fill="#475569" font-size="10">Automated `.well-known/acme-challenge`</text>

  <rect x="60" y="275" width="300" height="95" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <text x="75" y="302" fill="#1d4ed8" font-size="13" font-weight="600">DNS-01 ClusterIssuer</text>
  <text x="75" y="324" fill="#475569" font-size="11">Wildcard domains (`*.company.internal`)</text>
  <text x="75" y="344" fill="#475569" font-size="11">Providers: Cloudflare API Token &amp; Route53</text>
  <text x="75" y="360" fill="#16a34a" font-size="10" font-weight="600">Automated TXT record challenge creation</text>

  <rect x="60" y="385" width="300" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="412" fill="#0f172a" font-size="13" font-weight="600">Account Private Key Security</text>
  <rect x="75" y="426" width="140" height="24" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="85" y="442" fill="#1d4ed8" font-size="10" font-weight="600">K8s Secret Storage</text>
  <text x="75" y="470" fill="#64748b" font-size="11">Encrypted with KMS envelope encryption</text>

  <rect x="60" y="495" width="300" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="522" fill="#0f172a" font-size="13" font-weight="600">Rate-Limit Safeguards</text>
  <text x="75" y="545" fill="#475569" font-size="11">• Staging dry-run testing before prod</text>
  <text x="75" y="565" fill="#475569" font-size="11">• Prevents Let's Encrypt API throttling</text>

  <!-- COLUMN 2: Cert-Manager Operator & Challenges -->
  <rect x="410" y="110" width="370" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="410" y="110" width="370" height="40" rx="8" fill="#f1f5f9"/>
  <text x="430" y="136" fill="#dc2626" font-size="13" font-weight="700">2. OPERATOR ENGINE &amp; CHALLENGES</text>

  <rect x="430" y="165" width="330" height="90" rx="6" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
  <text x="445" y="192" fill="#b91c1c" font-size="13" font-weight="600">Cert-Manager Controller</text>
  <text x="445" y="214" fill="#475569" font-size="11">Watches Ingress &amp; Certificate CRDs</text>
  <text x="445" y="234" fill="#16a34a" font-size="10" font-weight="600">Automates CertificateRequest &amp; Order objects</text>
  <text x="445" y="248" fill="#64748b" font-size="10">Zero manual SSL certificate generation</text>

  <rect x="430" y="270" width="330" height="105" rx="6" fill="#f8fafc" stroke="#fed7aa" stroke-width="1"/>
  <text x="445" y="297" fill="#c2410c" font-size="13" font-weight="600">Challenge Solver Engine</text>
  <text x="445" y="320" fill="#15803d" font-size="11" font-weight="600">• Spawns ephemeral challenge HTTP pods</text>
  <text x="445" y="340" fill="#15803d" font-size="11" font-weight="600">• Updates Cloudflare / Route53 DNS zones</text>
  <text x="445" y="360" fill="#475569" font-size="11">• Automatic cleanup once challenge verified</text>

  <rect x="430" y="390" width="330" height="95" rx="6" fill="#f8fafc" stroke="#fed7aa" stroke-width="1"/>
  <text x="445" y="417" fill="#c2410c" font-size="13" font-weight="600">Automated Renewal Lifecycle</text>
  <text x="445" y="440" fill="#15803d" font-size="11" font-weight="600">• Certificate duration: 90 days (2160h)</text>
  <text x="445" y="460" fill="#475569" font-size="11">• renewBefore: 30 days (720h) threshold</text>
  <text x="445" y="478" fill="#b91c1c" font-size="10" font-weight="600">Never experience expired certificate outages</text>

  <rect x="430" y="500" width="330" height="80" rx="6" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1"/>
  <text x="445" y="527" fill="#4338ca" font-size="13" font-weight="600">Modern Cryptographic Algorithms</text>
  <text x="445" y="549" fill="#475569" font-size="11">• ECDSA P-384 / RSA 4096-bit private keys</text>
  <text x="445" y="569" fill="#475569" font-size="11">• rotationPolicy: Always (generates new key on renew)</text>

  <!-- COLUMN 3: Ingress & TLS Workloads -->
  <rect x="810" y="110" width="350" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="810" y="110" width="350" height="40" rx="8" fill="#f1f5f9"/>
  <text x="830" y="136" fill="#059669" font-size="13" font-weight="700">3. SECURED INGRESS &amp; WORKLOADS</text>

  <rect x="830" y="165" width="310" height="95" rx="6" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1"/>
  <text x="845" y="192" fill="#065f46" font-size="13" font-weight="600">Kubernetes Ingress Integration</text>
  <text x="845" y="214" fill="#475569" font-size="11">• `cert-manager.io/cluster-issuer: letsencrypt-prod`</text>
  <text x="845" y="234" fill="#059669" font-size="10" font-weight="600">Automatic TLS secret provisioning</text>
  <text x="845" y="250" fill="#475569" font-size="10">NGINX / Envoy / Traefik SSL termination</text>

  <rect x="830" y="275" width="310" height="95" rx="6" fill="#f8fafc" stroke="#bae6fd" stroke-width="1"/>
  <text x="845" y="302" fill="#0369a1" font-size="13" font-weight="600">Kubernetes TLS Secret CRD</text>
  <text x="845" y="325" fill="#475569" font-size="11">• Type: `kubernetes.io/tls`</text>
  <text x="845" y="345" fill="#475569" font-size="11">• Contains `tls.crt` and `tls.key`</text>
  <text x="845" y="362" fill="#475569" font-size="11">• Hot-reloaded by Ingress controllers</text>

  <rect x="830" y="385" width="310" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="845" y="412" fill="#0f172a" font-size="13" font-weight="600">Prometheus Expiration Metrics</text>
  <text x="845" y="435" fill="#475569" font-size="11">• `certmanager_certificate_expiration_timestamp`</text>
  <text x="845" y="455" fill="#475569" font-size="11">• Alerting rule: days_until_expiry &lt; 15</text>
  <text x="845" y="472" fill="#475569" font-size="11">• Grafana dashboard for PKI health</text>

  <rect x="830" y="495" width="310" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="845" y="522" fill="#0f172a" font-size="13" font-weight="600">Zero-Downtime TLS 1.3</text>
  <text x="845" y="545" fill="#475569" font-size="11">• Enforces TLS 1.3 minimum cipher suites</text>
  <text x="845" y="565" fill="#475569" font-size="11">• A+ Qualys SSL Labs rating achieved</text>
</svg>